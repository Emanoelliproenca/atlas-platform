spring.application.name=atlas

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas_portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:demo.admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD}
app.security.viewer.username=${APP_SECURITY_VIEWER_USERNAME:demo.viewer}
app.security.viewer.password=${APP_SECURITY_VIEWER_PASSWORD}
app.security.session-ttl-minutes=${APP_SECURITY_SESSION_TTL_MINUTES:120}
