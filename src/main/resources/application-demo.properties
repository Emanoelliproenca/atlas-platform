server.port=${PORT:8091}
spring.datasource.url=jdbc:h2:mem:atlas_platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:admin123}
app.security.viewer.username=${APP_SECURITY_VIEWER_USERNAME:viewer}
app.security.viewer.password=${APP_SECURITY_VIEWER_PASSWORD:viewer123}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4311,http://127.0.0.1:4311,http://localhost:4312,http://127.0.0.1:4312}
