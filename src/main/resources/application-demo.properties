server.port=8091
spring.datasource.url=jdbc:h2:mem:atlas_portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.security.admin.username=demo.admin
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD}
app.security.viewer.username=demo.viewer
app.security.viewer.password=${APP_SECURITY_VIEWER_PASSWORD}
