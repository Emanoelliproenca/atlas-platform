server.port=${PORT:8091}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}

app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD}
app.security.viewer.username=${APP_SECURITY_VIEWER_USERNAME}
app.security.viewer.password=${APP_SECURITY_VIEWER_PASSWORD}
app.security.session-ttl-minutes=${APP_SECURITY_SESSION_TTL_MINUTES:120}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.software-sync.manifest-url=${APP_SOFTWARE_SYNC_MANIFEST_URL:}
