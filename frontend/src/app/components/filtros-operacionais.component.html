<section class="filters-card" aria-label="Filtros operacionais">
  <div class="filters-row">
    <label class="filter-field">
      <mat-form-field appearance="outline" class="atlas-select-field">
      <mat-select aria-label="Filtrar por contrato" [ngModel]="contratoSelecionado()" (ngModelChange)="selecionarContrato($event)" panelClass="atlas-select-panel">
        <mat-option [value]="0">Todos os contratos</mat-option>
        @for (item of filtros().contratos; track item.id) {
          <mat-option [value]="item.id">{{ item.nome }}</mat-option>
        }
      </mat-select>
      </mat-form-field>
    </label>

    <label class="filter-field">
      <mat-form-field appearance="outline" class="atlas-select-field">
      <mat-select aria-label="Filtrar por serviço" [ngModel]="servicoSelecionado()" (ngModelChange)="selecionarServico($event)" panelClass="atlas-select-panel">
        <mat-option [value]="0">Todos os serviços</mat-option>
        @for (item of filtros().servicos; track item.id) {
          <mat-option [value]="item.id">{{ item.nome }}</mat-option>
        }
      </mat-select>
      </mat-form-field>
    </label>

    <label class="filter-field">
      <mat-form-field appearance="outline" class="atlas-select-field">
      <mat-select aria-label="Filtrar por setor" [ngModel]="setor()" (ngModelChange)="setorChange.emit($event)" panelClass="atlas-select-panel">
        <mat-option value="">Todos os setores</mat-option>
        @for (item of filtros().setores; track item) {
          <mat-option [value]="item">{{ item }}</mat-option>
        }
      </mat-select>
      </mat-form-field>
    </label>

    <label class="filter-field">
      <mat-form-field appearance="outline" class="atlas-select-field">
      <mat-select aria-label="Filtrar por situação" [value]="'ativos'" disabled panelClass="atlas-select-panel">
        <mat-option value="ativos">Somente ativos</mat-option>
      </mat-select>
      </mat-form-field>
    </label>

    <div class="header-actions">
      <button type="button" class="primary-button" (click)="aplicar.emit()" [disabled]="carregando()">
        {{ carregando() ? 'Buscando...' : 'Buscar' }}
      </button>
      <button type="button" class="ghost-button" (click)="limpar.emit()">Limpar</button>
    </div>
  </div>
</section>
