<header class="panel-heading">
  <p class="panel-kicker">Acesso ATLAS</p>
  <h2 class="panel-title">Entre na plataforma</h2>
  <p class="panel-subtitle">Informe usuário e senha para acessar o painel operacional.</p>
</header>

<label class="field-hidden">
  <input [ngModel]="baseUrl()" (ngModelChange)="baseUrlChange.emit($event)" placeholder="http://localhost:8091" />
</label>

<div class="form-stack">
  <mat-form-field appearance="outline" class="login-form-field">
    <mat-label>Usuário</mat-label>
    <span matTextPrefix class="field-icon user-icon" aria-hidden="true"></span>
    <input
      matInput
      autocomplete="username"
      [ngModel]="username()"
      (ngModelChange)="usernameChange.emit($event)"
      aria-label="Usuário"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="login-form-field">
    <mat-label>Senha</mat-label>
    <span matTextPrefix class="field-icon lock-icon" aria-hidden="true"></span>
    <input
      matInput
      [type]="mostrarSenha() ? 'text' : 'password'"
      autocomplete="current-password"
      [ngModel]="password()"
      (ngModelChange)="passwordChange.emit($event)"
      aria-label="Senha"
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="field-toggle"
      (click)="alternarSenha()"
      [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
    >
      <span class="eye-icon" [class.visible]="mostrarSenha()" aria-hidden="true"></span>
    </button>
  </mat-form-field>
</div>

<button
  mat-flat-button
  type="button"
  class="primary-button"
  (click)="solicitarEntrada()"
  [disabled]="carregando() || !formularioValido()"
>
  @if (carregando()) {
    <mat-spinner diameter="18"></mat-spinner>
  }
  <span>{{ carregando() ? 'Entrando...' : 'Entrar' }}</span>
</button>

@if (erro()) {
  <p class="error-banner">{{ erro() }}</p>
}
