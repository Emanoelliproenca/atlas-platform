<section class="relationship-shell">
  <header class="relationship-header">
    <div class="relationship-copy">
      <h1>Painel de relacionamentos</h1>
      <p>Mapa operacional consolidado.</p>
    </div>

    <div class="relationship-actions">
      <button type="button" class="primary-action" (click)="carregarPainel()" [disabled]="carregando()">
        {{ carregando() ? 'Atualizando...' : 'Atualizar leitura' }}
      </button>
      @if (ehAdmin()) {
        <a routerLink="/cadastros" class="secondary-action">Gerenciar base</a>
      }
    </div>
  </header>

  @if (erro()) {
    <article class="relationship-state error">{{ erro() }}</article>
  } @else if (painelVisual(); as painelAtual) {
    <app-resumo-cards [resumo]="painelAtual.resumo" />

    <app-filtros-operacionais
      [filtros]="painelAtual.filtros"
      [grupo]="grupo()"
      [setor]="setor()"
      [contratoIds]="contratoIds()"
      [servicoIds]="servicoIds()"
      [carregando]="carregando()"
      (grupoChange)="grupo.set($event)"
      (setorChange)="setor.set($event)"
      (contratosSelecionadosChange)="atualizarContratosSelecionados($event)"
      (servicosSelecionadosChange)="atualizarServicosSelecionados($event)"
      (aplicar)="carregarPainel()"
      (limpar)="limparFiltros()" />

    <app-tabela-operacional
      [linhas]="painelAtual.linhas"
      [ultimaAtualizacao]="ultimaAtualizacaoFormatada()" />
  } @else {
    <article class="relationship-state">
      {{ carregando() ? 'Carregando dados...' : 'Nenhum relacionamento encontrado.' }}
    </article>
  }
</section>
